# nginx-Konfiguration für mcp.blackair.dev
# Leitet NUR den geheimen Pfad an den SSH-Tunnel (127.0.0.1:8808) weiter.
#
# 1. GEHEIM_ERSETZEN durch deinen eigenen geheimen Token ersetzen
#    (erzeugen mit: openssl rand -hex 24)
# 2. Datei nach /etc/nginx/sites-available/ kopieren und verlinken
# 3. Zertifikat holen: sudo certbot --nginx -d mcp.blackair.dev

server {
    listen 80;
    server_name mcp.blackair.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.blackair.dev;

    ssl_certificate     /etc/letsencrypt/live/mcp.blackair.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.blackair.dev/privkey.pem;

    # Keine Zugriffs-Logs, damit der geheime Pfad nicht in Logdateien landet
    access_log off;

    location = /GEHEIM_ERSETZEN/mcp {
        proxy_pass http://127.0.0.1:8808/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Wichtig für MCP-Streaming (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Alles andere wird abgelehnt
    location / {
        return 404;
    }
}
